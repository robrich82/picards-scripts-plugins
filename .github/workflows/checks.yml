name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail, rather than relock, when uv.lock is out of date with pyproject.toml

jobs:
  # Which jobs a pull request's changed paths need (tools/ci_changes.py); any other run needs all.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      lint: ${{ steps.jobs.outputs.lint }}
      test: ${{ steps.jobs.outputs.test }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # a pull request's merge commit and its parents: HEAD^1 is the base
      - id: jobs
        run: python3 tools/ci_changes.py >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          cache: false # a restored tool cache isn't checked against mise.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv cache prune --ci

  test:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          cache: false # a restored tool cache isn't checked against mise.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock', 'tools/run_tests.py') }}
      - run: python3 tools/run_tests.py --coverage # fails below [tool.coverage.report] fail_under
      # After the tests: ty reads the venv and Picard source they put in .picard/. Runs even when a test fails.
      - if: ${{ !cancelled() }}
        run: uv sync
      - if: ${{ !cancelled() }}
        run: uv run ty check
      - run: uv cache prune --ci # actions/cache only saves after a green job

  # The hooks' Windows code (find_uv, kill_tree, Git Bash paths) and the tests skipped off Windows.
  # No --coverage: `test` already enforces it, and it triples the run time.
  test-windows:
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - run: git config --global core.autocrlf input # the runner's default, true, checks out CRLF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.14
          cache: false # a restored tool cache isn't checked against mise.lock
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/uv/cache
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock', 'tools/run_tests.py') }}
      - run: python tools/run_tests.py
      - run: uv cache prune --ci # actions/cache only saves after a green job

  # Require this check, not the jobs: a job the filter skipped reports skipped, which passes here.
  # always(): without it, a failed job would skip this one, and a skipped required check passes.
  gate:
    if: always()
    needs: [changes, lint, test, test-windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
