name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1" # fail, rather than relock, when uv.lock is out of date with pyproject.toml

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: uv
        run: |
          version=$(sed -n 's/^uv = "\(.*\)"$/\1/p' mise.toml)
          test -n "$version" || { echo "::error::no uv version in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - id: uv
        run: |
          version=$(sed -n 's/^uv = "\(.*\)"$/\1/p' mise.toml)
          test -n "$version" || { echo "::error::no uv version in mise.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ steps.uv.outputs.version }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            tools/run_tests.py
      - run: python3 tools/run_tests.py
      # After the tests: ty reads the venv and Picard source they put in .picard/. Runs even when a test fails.
      - if: ${{ !cancelled() }}
        run: uv sync
      - if: ${{ !cancelled() }}
        run: uv run ty check
