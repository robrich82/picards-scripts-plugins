min_version = "2026.11.1" # the first release that reads mise.lock's lockfile_version 4

[settings]
lockfile = true
# `[deps]` below is experimental; without this, `mise exec`, `mise run` and `mise deps` error.
experimental = true

[tools]
uv = "0.13.10"

# `mise deps` runs `uv sync` when uv.lock or pyproject.toml changed or .venv is missing;
# `mise exec`, `mise run` and mise's shims do it first too, `mise install` doesn't.
# Not `--locked`: through a shim, that would fail `uv lock` itself after a pyproject.toml
# edit. CI sets UV_LOCKED, so it still refuses a stale uv.lock.
[deps.uv]
auto = true

# Picard must be closed; tools/install.py checks.
[tasks.install-all]
description = "Install the tagger scripts and the plugin into Picard"
run = "python tools/install.py all"

[tasks.install-plugin]
description = "Install the plugin into Picard"
run = "python tools/install.py plugin"

[tasks.install-scripts]
description = "Install the tagger scripts into Picard"
run = "python tools/install.py scripts"

[tasks.test]
description = "Run the tests; extra arguments go to pytest"
run = "python tools/run_tests.py"
