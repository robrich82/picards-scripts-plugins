[project]
name = "picards-scripts-plugins"
version = "0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "ty==0.0.99",
]

[tool.uv]
exclude-newer = "1 day"

[tool.ruff]
# These and the Claude hooks run on whatever Python is installed, before the 3.12 venv exists.
per-file-target-version = { "tools/run_tests.py" = "py39", "tools/install.py" = "py39", ".claude/hooks/*.py" = "py39" }

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"plugins/*/__init__.py" = ["N999"]  # the folder name is the plugin's install path

[tool.ty.environment]
# The test venv and the Picard source tools/run_tests.py fetches; the plugin runs inside Picard.
python = ".picard/venv"
extra-paths = [".picard/src", ".picard/src/test", "tools"]
