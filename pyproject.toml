[project]
name = "picards-scripts-plugins"
version = "0"
requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = ["ruff==0.17.4"]

[tool.uv]
exclude-newer = "1 day"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"plugins/*/__init__.py" = ["N999"]  # the folder name is the plugin's install path
