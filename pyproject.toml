[project]
name = "picards-scripts-plugins"
version = "0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
# Installed into the test venv by tools/run_tests.py, not by uv sync.
coverage = [
    "coverage==7.17.3",
]
dev = [
    "ruff==0.17.5",
    "ty==0.0.102",
]

[tool.uv]
exclude-newer = "1 day"

[tool.ruff]
# py39: these and the Claude hooks run on whatever Python is installed, before the test venv exists.
# py310: plugins run on Picard's Python, which can be as old as Picard 3's minimum.
per-file-target-version = { "tools/run_tests.py" = "py39", "tools/install.py" = "py39", ".claude/hooks/*.py" = "py39", "plugins/**" = "py310" }

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"plugins/*/__init__.py" = ["N999"]  # the folder name is the plugin's install path

[tool.ty.environment]
# The test venv and the Picard source tools/run_tests.py fetches; the plugin runs inside Picard.
python = ".picard/venv"
extra-paths = [".picard/src", ".picard/src/test", "tools"]

[tool.coverage.run]
# source_dirs, not source, with relative_files: coverage.xml names files by repo path, which GitHub matches.
source_dirs = ["tools", "plugins", ".claude/hooks"]
patch = ["subprocess"]  # the hook tests run .claude/hooks/*.py as subprocesses
branch = true
relative_files = true
data_file = ".picard/coverage/.coverage"

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
include_namespace_packages = true  # list never-run files in folders without __init__.py
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = ".picard/coverage.xml"
